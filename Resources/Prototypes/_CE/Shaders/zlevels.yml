# CrystallEdge: Z-level blur shader (used by CEZLevelBlurOverlay)
- type: shader
  id: CEZBlur
  kind: source
  path: "/Textures/_CE/Shaders/zblur.swsl"
  params:
    STRENGTH: 1.0
    FADE: 1.0

# CrystallEdge: composites transit-grid viewport onto the main viewport with
# height-scaled haze + dissolve (used by ScalingViewport.RenderTransitOverhead)
- type: shader
  id: CEZBlurBlit
  kind: source
  path: "/Textures/_CE/Shaders/zblur_blit.swsl"
  params:
    STRENGTH: 1.0
    FADE: 1.0
    CLOUD: 0.0

# cloud layer shader
- type: shader
  id: CEZClouds
  kind: source
  path: "/Textures/_CE/Shaders/zclouds.swsl"
  params:
    COVERAGE: 1.0

# planet descent-to-network shader
- type: shader
  id: CEZAscentClouds
  kind: source
  path: "/Textures/_CE/Shaders/zascent_clouds.swsl"
  params:
    COVERAGE: 1.0
    SCROLL: 0.0
